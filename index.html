    <!-- Applique le thème enregistré avant le premier rendu (évite le flash) -->
    <script>
      (function () {
        var d = document.documentElement;
        var t = "dark";
        try { if (localStorage.getItem("theme") === "light") t = "light"; } catch (e) {}
        d.dataset.theme = t;
        d.classList.add("js");
      })();
    </script>
