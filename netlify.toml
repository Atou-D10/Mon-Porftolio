# Configuration Netlify : build, cache et en-têtes de sécurité
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Fichiers versionnés par Vite (hash dans le nom) : cache long
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/CV_Atou_DIAGNE_IA.pdf"
  [headers.values]
    Content-Disposition = "inline; filename=\"CV_Atou_DIAGNE.pdf\""
